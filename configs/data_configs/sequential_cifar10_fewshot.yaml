name: sequential_cifar10
root: /data1/dataset/cifar10
num_classes: 10
is_event: true
num_workers: 4
pin_memory: true

# train/val split (from CIFAR-10's 50k training set)
val_ratio: 0.1
split_seed: 42

# S4 / Mamba sCIFAR convention (few-shot variant):
# 32x32 RGB row-major flatten -> [L=1024, D=3] float32, normalized with
# CIFAR-10 per-channel mean/std (Krizhevsky's stats).
# For the LRA "Image" task use sequential_cifar10_lra_fewshot.yaml instead.
grayscale: false
quantize_to_int: false
normalize_to_01: true
channel_normalize: true
permute: false
permute_seed: 0
download: true
train_drop_last: false
patch_size: 1

# --------- Few-shot subsampling of the train split ---------
# Set ONE of {train_subset_ratio, train_subset_size}. Val/test are unaffected.
# The subsampling is applied AFTER the train/val split, so val accuracy
# remains comparable across different few-shot scales.
#
# - train_subset_ratio: float in (0, 1]. Fraction of the train split to keep.
# - train_subset_size:  int. Absolute number of train samples to keep
#                       (overrides ratio when both are set).
# - train_subset_balanced: if true, sample equally per class
#                          (size is rounded down to a per-class count).
# - train_subset_seed:  RNG seed for reproducible subsampling.
train_subset_ratio: 0.1
train_subset_size: null
train_subset_balanced: true
train_subset_seed: 0

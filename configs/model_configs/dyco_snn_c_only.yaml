name: dyco_snn
T: 16                   # raised from 8 to fit the 6-layer (2-block) cascade; must match data config
num_classes: 2
image_size: 32
in_channels: 2

mode: c_only            # Channel C only: plain LIF + recurrence.

n_blocks: 2
stem_dim: 64
n_l4: 48
n_23e: 64
n_23i: 16
n_l5: 48

# Channel-D off.
learnable_tau: false
learnable_asc: false
heterogeneous_init: false

# Channel-C on.
recurrent_enabled: true

# Allocation: alpha frozen at 1 -> all current via recurrent path.
alpha_init: 1.0
alpha_learnable: false

# Spike threshold (shared across all D/C/DC/FF arms for a fair ablation).
# 0.5 (not 1.0): at v_th=1.0 each GLIF3 layer needs more steps to cross threshold,
# leaving the deep 2-block cascade subthreshold; 0.5 speeds per-layer charge-up
# (paired with T=16) without touching tau_m.
v_th: 0.5

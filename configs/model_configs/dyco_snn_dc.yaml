name: dyco_snn
T: 8
num_classes: 2
image_size: 32
in_channels: 2

mode: dc                # D + C with learnable allocation alpha.

n_blocks: 2
stem_dim: 64
n_l4: 48
n_23e: 64
n_23i: 16
n_l5: 48

# Channel-D on.
learnable_tau: true
learnable_asc: true
heterogeneous_init: true

# Channel-C on.
recurrent_enabled: true

# Allocation: learnable per-block alpha.
alpha_init: 0.5
alpha_learnable: true

# Spike threshold (shared across all D/C/DC/FF arms for a fair ablation).
# 0.5 (not 1.0): the 3-layer L4->L23->L5 GLIF3 cascade is ~1-2 steps short of
# v_th=1.0 within T=8 and goes silent at L5; 0.5 gives margin without touching tau_m.
v_th: 0.5

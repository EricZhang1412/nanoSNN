# Gate 1 pilot — DVS128-Gesture, condition C0 (memoryless SDLA baseline).
# Backbone shared across C0–C3: Spikformer depth=2, embed_dim=256, num_heads=4, head_dim=64.
name: spikformer
T: 16
num_classes: 11
image_size: 128
patch_size: 16
in_channels: 2
embed_dim: 256
depth: 2
num_heads: 4
mlp_ratio: 4.0

# Attention swap point (only thing that differs across conditions).
attention_type: c0_sdla

# Neuron params (shared).
neuron_type: lif
tau: 2.0
v_threshold: 1.0
detach_reset: true
surrogate: atan

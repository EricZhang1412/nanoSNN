batch_size_per_gpu: 4
random_seed: 42
limit_train_batches: null     # set to 0.05 for a 5% 1-epoch smoke run

trainer:
  strategy: auto
  precision: "bf16-mixed"     # bf16 NaN -> fall back to "32-true"
  max_epochs: 16
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  val_check_interval: 1.0
  enable_checkpointing: true
  save_every_n_train_steps: 2000
  accumulate_grad_batches: 1  # 4-GPU DDP × B=16 = effective 64 (matches paper)
